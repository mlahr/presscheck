fail_at: error
checks:
  document_integrity.ghostscript_processable:
    enabled: true
    severity: error
    timeout_seconds: 60
  fonts.non_embedded:
    enabled: true
    severity: error
    timeout_seconds: 60
  fonts.minimum_text_size:
    enabled: true
    severity: warning
    min_pt: 6
    timeout_seconds: 60
  images.low_effective_resolution:
    enabled: true
    severity: error
    min_dpi: 300
    timeout_seconds: 60
  images.jpeg_compression_policy:
    enabled: true
    severity: warning
    timeout_seconds: 60
  images.image_filter_policy:
    enabled: true
    severity: warning
    severity_by_filter:
      DCTDecode:
      FlateDecode:
      CCITTFaxDecode:
      JPXDecode: warning
      JBIG2Decode: warning
      Other: warning
    timeout_seconds: 60
  images.has_soft_mask:
    enabled: true
    severity: warning
    timeout_seconds: 60
  color.image_color_space_policy:
    enabled: true
    severity: warning
    severity_by_family:
      DeviceRGB: error
      ICCBasedRGB: warning
      DeviceCMYK:
      ICCBasedCMYK:
      DeviceGray:
      ICCBasedGray:
      Indexed: warning
      Separation: warning
      DeviceN: warning
      Other: warning
  color.output_intent_required:
    enabled: true
    severity: error
    timeout_seconds: 60
  color.registration_color_misuse:
    enabled: true
    severity: error
    timeout_seconds: 60
  color.spot_color_policy:
    enabled: true
    severity: warning
    allowed_colorants: []
    ignored_colorants:
      - All
      - None
    timeout_seconds: 60
  graphics.overprint_policy:
    enabled: true
    severity: warning
    timeout_seconds: 60
  interactive.annotation_policy:
    enabled: true
    severity: warning
    severity_by_subtype:
      Link: warning
      Widget: error
      FileAttachment: error
      Movie: error
      Sound: error
      Screen: error
      Other: warning
    timeout_seconds: 60
  interactive.link_uri_policy:
    enabled: true
    severity: warning
    allowed_schemes: []
    disallow_all: true
    timeout_seconds: 60
  interactive.annotation_bounds_within_box:
    enabled: true
    severity: warning
    box: CropBox
    tolerance_pt: 0.5
    timeout_seconds: 60
  interactive.javascript_policy:
    enabled: true
    severity: error
    timeout_seconds: 60
  interactive.embedded_files_policy:
    enabled: true
    severity: error
    timeout_seconds: 60
  interactive.form_policy:
    enabled: true
    severity: error
    timeout_seconds: 60
  transparency.live_transparency_policy:
    enabled: true
    severity: warning
    severity_by_feature:
      stroking_alpha: warning
      non_stroking_alpha: warning
      soft_mask: warning
      blend_mode: warning
      transparency_group: warning
    timeout_seconds: 60
  geometry.page_boxes_present:
    enabled: true
    severity: error
    required_boxes:
      - MediaBox
      - TrimBox
      - BleedBox
  geometry.trim_size_matches:
    enabled: true
    severity: error
    expected_width_pt: 612
    expected_height_pt: 792
    tolerance_pt: 0.5
  geometry.bleed_margin_at_least:
    enabled: true
    severity: error
    margin_pt: 9
    tolerance_pt: 0.5
  geometry.object_bounds_within_box:
    enabled: true
    severity: warning
    box: BleedBox
    tolerance_pt: 0.5
