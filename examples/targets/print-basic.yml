fail_at: error
checks:
  document_integrity.ghostscript_processable:
    enabled: true
    severity: error
    timeout_seconds: 60
  fonts.non_embedded:
    enabled: true
    severity: error
    timeout_seconds: 60
  images.low_effective_resolution:
    enabled: true
    severity: error
    min_dpi: 300
    timeout_seconds: 60
  color.image_color_space_policy:
    enabled: true
    severity: warning
    severity_by_family:
      DeviceRGB: error
      ICCBasedRGB: warning
      DeviceCMYK:
      ICCBasedCMYK:
      DeviceGray:
      ICCBasedGray:
      Indexed: warning
      Separation: warning
      DeviceN: warning
      Other: warning
  geometry.page_boxes_present:
    enabled: true
    severity: error
    required_boxes:
      - MediaBox
      - TrimBox
      - BleedBox
  geometry.trim_size_matches:
    enabled: true
    severity: error
    expected_width_pt: 612
    expected_height_pt: 792
    tolerance_pt: 0.5
