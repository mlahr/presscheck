fail_at: error
checks:
  document_integrity.ghostscript_processable:
    enabled: true
    severity: error
    timeout_seconds: 60
  fonts.non_embedded:
    enabled: true
    severity: warning
    timeout_seconds: 60
  images.low_effective_resolution:
    enabled: true
    severity: warning
    min_dpi: 120
    timeout_seconds: 60
  color.image_color_space_policy:
    enabled: true
    severity: info
    severity_by_family:
      DeviceRGB:
      ICCBasedRGB:
      DeviceCMYK: info
      ICCBasedCMYK: info
      DeviceGray:
      ICCBasedGray:
      Indexed:
      Separation: info
      DeviceN: info
      Other: info
  color.output_intent_required:
    enabled: false
    severity: warning
    timeout_seconds: 60
  geometry.page_boxes_present:
    enabled: true
    severity: error
    required_boxes:
      - MediaBox
  geometry.trim_size_matches:
    enabled: false
    severity: warning
    expected_width_pt: 612
    expected_height_pt: 792
    tolerance_pt: 0.5
