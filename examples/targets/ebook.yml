fail_at: error
checks:
  document_integrity.ghostscript_processable:
    enabled: true
    severity: error
    timeout_seconds: 60
  fonts.non_embedded:
    enabled: true
    severity: warning
    timeout_seconds: 60
  images.low_effective_resolution:
    enabled: true
    severity: warning
    min_dpi: 120
    timeout_seconds: 60
  geometry.page_boxes_present:
    enabled: true
    severity: error
    required_boxes:
      - MediaBox
  geometry.trim_size_matches:
    enabled: false
    severity: warning
    expected_width_pt: 612
    expected_height_pt: 792
    tolerance_pt: 0.5

