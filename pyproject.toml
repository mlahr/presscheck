[project]
name = "pdfdancer-preflight"
version = "0.1.0"
description = "Architecture prototype for PDFdancer preflight checks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pypdf>=5.1.0",
    "pyyaml>=6.0.2",
    "typer>=0.15.1",
]

[project.scripts]
pdfdancer-preflight = "pdfdancer_preflight.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

