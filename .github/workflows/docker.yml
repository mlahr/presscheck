name: Docker

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image version
        id: version
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            raw_version="${{ inputs.version }}"
          else
            raw_version="${GITHUB_REF_NAME}"
          fi

          if ! printf '%s' "${raw_version}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must match vMAJOR.MINOR.PATCH, got '${raw_version}'."
            exit 1
          fi

          echo "version=${raw_version#v}" >> "${GITHUB_OUTPUT}"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha

      - name: Verify existing package is private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          package="${GITHUB_REPOSITORY#*/}"
          visibility="$(
            gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}" --jq .visibility 2>/dev/null || true
          )"

          if [ -z "${visibility}" ]; then
            echo "GHCR package ${GITHUB_REPOSITORY_OWNER}/${package} does not exist yet; post-publish privacy checks will enforce visibility."
            exit 0
          fi

          if [ "${visibility}" != "private" ]; then
            echo "::error::Existing GHCR package ${GITHUB_REPOSITORY_OWNER}/${package} visibility is '${visibility}', expected 'private'."
            exit 1
          fi

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify package is private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          package="${GITHUB_REPOSITORY#*/}"
          visibility="$(gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}" --jq .visibility)"

          if [ "${visibility}" != "private" ]; then
            echo "::error::GHCR package ${GITHUB_REPOSITORY_OWNER}/${package} visibility is '${visibility}', expected 'private'."
            exit 1
          fi

      - name: Verify anonymous pulls are blocked
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${IMAGE_NAME}:${IMAGE_VERSION}"
          docker manifest inspect "${image}" >/dev/null

          anon_docker_config="$(mktemp -d)"
          trap 'rm -rf "${anon_docker_config}"' EXIT

          if DOCKER_CONFIG="${anon_docker_config}" docker manifest inspect "${image}" >/dev/null 2>&1; then
            echo "::error::Anonymous manifest access succeeded for ${image}; the image is publicly readable."
            exit 1
          fi
